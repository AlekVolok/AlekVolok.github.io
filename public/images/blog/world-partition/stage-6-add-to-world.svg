<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Incremental AddToWorld work across frames</title><desc id="d">Actor and component registration is sliced across multiple frame budgets rather than completed in a single hitch.</desc><style>.bg{fill:#0b0d0f}.frame{fill:#171b1f;stroke:#3a4249}.work{fill:#23433f;stroke:#5eead4}.k{fill:#5eead4;font:600 12px monospace}.h{fill:#eef2f3;font:600 16px system-ui}.p{fill:#8f9ba3;font:13px system-ui}</style><rect class="bg" width="900" height="300" rx="16"/><text class="k" x="42" y="42">ADD TO WORLD · TIME-SLICED</text><g transform="translate(42 76)"><rect class="frame" width="248" height="150" rx="10"/><text class="h" x="20" y="32">Frame N</text><rect class="work" x="20" y="55" width="75" height="62" rx="6"/><rect class="work" x="103" y="55" width="52" height="62" rx="6"/><rect x="163" y="55" width="65" height="62" rx="6" fill="#252b30"/><text class="p" x="20" y="140">register first batch</text></g><g transform="translate(326 76)"><rect class="frame" width="248" height="150" rx="10"/><text class="h" x="20" y="32">Frame N+1</text><rect class="work" x="20" y="55" width="112" height="62" rx="6"/><rect x="140" y="55" width="88" height="62" rx="6" fill="#252b30"/><text class="p" x="20" y="140">continue after budget</text></g><g transform="translate(610 76)"><rect class="frame" width="248" height="150" rx="10"/><text class="h" x="20" y="32">Frame N+2</text><rect class="work" x="20" y="55" width="208" height="62" rx="6"/><text class="p" x="20" y="140">actors fully registered</text></g><text class="p" x="450" y="268" text-anchor="middle">Incremental work trades one large hitch for bounded per-frame cost.</text></svg>
