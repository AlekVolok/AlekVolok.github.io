<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Runtime hash selects target cells</title><desc id="d">A streaming source overlaps grid cells. Inner cells are activated, outer cells are loaded, and distant cells remain unloaded.</desc><defs><pattern id="g" width="52" height="52" patternUnits="userSpaceOnUse"><rect width="52" height="52" fill="#171b1f" stroke="#343b41"/></pattern><style>.bg{fill:#0b0d0f}.grid{fill:url(#g)}.load{fill:#23433f;stroke:#5eead4}.active{fill:#5eead4;stroke:#a7f3e8}.k{fill:#5eead4;font:600 12px monospace;letter-spacing:.06em}.h{fill:#eef2f3;font:600 15px system-ui}.p{fill:#8f9ba3;font:13px system-ui}</style></defs><rect class="bg" width="900" height="300" rx="16"/><text class="k" x="42" y="40">SPATIAL QUERY → TARGET STATE</text><g transform="translate(46 58)"><rect class="grid" width="520" height="208" rx="8"/><g class="load"><rect x="156" y="52" width="52" height="52"/><rect x="208" y="52" width="52" height="52"/><rect x="260" y="52" width="52" height="52"/><rect x="156" y="104" width="52" height="52"/><rect x="260" y="104" width="52" height="52"/><rect x="208" y="156" width="52" height="52"/></g><g class="active"><rect x="208" y="104" width="52" height="52"/></g><circle cx="234" cy="130" r="8" fill="#0b0d0f"/><path d="m234 112-7 13h14z" fill="#eef2f3"/></g><g transform="translate(625 79)"><rect class="active" width="24" height="24"/><text class="h" x="40" y="18">Activated</text><text class="p" x="40" y="39">added to world</text><rect class="load" y="69" width="24" height="24"/><text class="h" x="40" y="87">Loaded</text><text class="p" x="40" y="108">package in memory</text><rect x="0" y="138" width="24" height="24" fill="#171b1f" stroke="#343b41"/><text class="h" x="40" y="156">Unloaded</text><text class="p" x="40" y="177">no resident package</text></g></svg>
