<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Streaming update position in the game tick</title><desc id="d">A frame timeline runs through physics tick groups, then updates World Partition streaming after PostPhysics.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5z" fill="#5eead4"/></marker><style>.bg{fill:#0b0d0f}.box{fill:#171b1f;stroke:#3a4249}.hot{fill:#14201f;stroke:#5eead4}.line{fill:none;stroke:#5eead4;stroke-width:2;marker-end:url(#a)}.k{fill:#5eead4;font:600 12px monospace;letter-spacing:.08em}.h{fill:#eef2f3;font:600 17px system-ui}.p{fill:#8f9ba3;font:13px system-ui}</style></defs><rect class="bg" width="900" height="300" rx="16"/><text class="k" x="40" y="42">ONE GAME FRAME</text><path class="line" d="M112 147H786"/><g transform="translate(40 92)"><rect class="box" width="175" height="110" rx="10"/><text class="h" x="22" y="43">PrePhysics</text><text class="p" x="22" y="70">actors begin tick</text></g><g transform="translate(250 92)"><rect class="box" width="175" height="110" rx="10"/><text class="h" x="22" y="43">Physics</text><text class="p" x="22" y="70">movement resolves</text></g><g transform="translate(460 92)"><rect class="box" width="175" height="110" rx="10"/><text class="h" x="22" y="43">PostPhysics</text><text class="p" x="22" y="70">final source position</text></g><g transform="translate(670 78)"><rect class="hot" width="190" height="138" rx="10"/><text class="k" x="22" y="31">STREAMING</text><text class="h" x="22" y="62">Update state</text><text class="p" x="22" y="89">sees this frame's</text><text class="p" x="22" y="109">camera movement</text></g><text class="p" x="450" y="258" text-anchor="middle">Paused or non-game world? The update is skipped.</text></svg>
