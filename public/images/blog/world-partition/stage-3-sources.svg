<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Streaming sources and their hash</title><desc id="d">Camera and player sources overlap a world grid. Their positions are hashed; an unchanged hash skips the expensive spatial query.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5z" fill="#5eead4"/></marker><pattern id="g" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#30363c"/></pattern><style>.bg{fill:#0b0d0f}.panel{fill:#101316;stroke:#2b3035}.range{fill:#5eead41c;stroke:#5eead4;stroke-width:2}.line{fill:none;stroke:#5eead4;stroke-width:1.7;marker-end:url(#a)}.k{fill:#5eead4;font:600 12px monospace;letter-spacing:.06em}.h{fill:#eef2f3;font:600 16px system-ui}.p{fill:#8f9ba3;font:13px system-ui}</style></defs><rect class="bg" width="900" height="300" rx="16"/><rect class="panel" x="38" y="32" width="430" height="236" rx="12"/><rect x="60" y="52" width="386" height="196" fill="url(#g)"/><circle class="range" cx="255" cy="150" r="76"/><path d="m255 132-15 32 15-8 15 8z" fill="#eef2f3"/><text class="k" x="72" y="75">RUNTIME GRID</text><text class="p" x="274" y="142">source range</text><path class="line" d="M468 150H548"/><g transform="translate(548 67)"><rect class="panel" width="312" height="166" rx="12"/><text class="k" x="24" y="32">SOURCE HASH</text><text class="h" x="24" y="68">Position + shape + priority</text><path d="M24 91H288" stroke="#30363c"/><text class="p" x="24" y="119">unchanged → velocity only</text><text class="p" x="24" y="145">changed → query the grid</text></g></svg>
