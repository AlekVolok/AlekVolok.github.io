<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Streaming level state machine</title><desc id="d">A runtime cell requests its package asynchronously, becomes loaded in memory, then activates its streaming level.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5z" fill="#5eead4"/></marker><style>.bg{fill:#0b0d0f}.box{fill:#171b1f;stroke:#3a4249}.hot{fill:#14201f;stroke:#5eead4}.line{fill:none;stroke:#5eead4;stroke-width:1.7;marker-end:url(#a)}.k{fill:#5eead4;font:600 12px monospace}.h{fill:#eef2f3;font:600 16px system-ui}.p{fill:#8f9ba3;font:13px system-ui}</style></defs><rect class="bg" width="900" height="300" rx="16"/><text class="k" x="42" y="43">ULEVELSTREAMING STATE MACHINE</text><path class="line" d="M217 148H258"/><path class="line" d="M432 148H473"/><path class="line" d="M647 148H688"/><g transform="translate(42 96)"><rect class="box" width="175" height="104" rx="10"/><text class="k" x="20" y="30">CELL</text><text class="h" x="20" y="60">Unloaded</text></g><g transform="translate(258 96)"><rect class="hot" width="174" height="104" rx="10"/><text class="k" x="20" y="30">ASYNC I/O</text><text class="h" x="20" y="60">RequestLevel</text><text class="p" x="20" y="82">package in flight</text></g><g transform="translate(473 96)"><rect class="box" width="174" height="104" rx="10"/><text class="k" x="20" y="30">MEMORY</text><text class="h" x="20" y="60">Loaded</text><text class="p" x="20" y="82">actors exist</text></g><g transform="translate(688 96)"><rect class="hot" width="170" height="104" rx="10"/><text class="k" x="20" y="30">WORLD</text><text class="h" x="20" y="60">Activated</text><text class="p" x="20" y="82">level is visible</text></g><text class="p" x="450" y="246" text-anchor="middle">BlockPolicy can replace the async wait with a synchronous hitch.</text></svg>
