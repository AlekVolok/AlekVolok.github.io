<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Streaming subsystem interface dispatch</title><desc id="d">The world update calls a shared streaming interface which dispatches to World Partition, Level Instances, and other subsystem implementations.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5z" fill="#5eead4"/></marker><style>.bg{fill:#0b0d0f}.box{fill:#171b1f;stroke:#3a4249}.hot{fill:#14201f;stroke:#5eead4}.line{fill:none;stroke:#5eead4;stroke-width:1.7;marker-end:url(#a)}.k{fill:#5eead4;font:600 12px monospace;letter-spacing:.06em}.h{fill:#eef2f3;font:600 16px system-ui}.p{fill:#8f9ba3;font:13px system-ui}</style></defs><rect class="bg" width="900" height="300" rx="16"/><path class="line" d="M242 150H350"/><path class="line" d="M550 150H615V70H682"/><path class="line" d="M550 150H682"/><path class="line" d="M550 150H615V230H682"/><g transform="translate(40 102)"><rect class="box" width="202" height="96" rx="10"/><text class="k" x="20" y="29">UWORLD</text><text class="h" x="20" y="59">Update streaming</text></g><g transform="translate(350 88)"><rect class="box" width="200" height="124" rx="10"/><text class="k" x="20" y="29">INTERFACE</text><text class="h" x="20" y="59">OnUpdate</text><text class="h" x="20" y="80">StreamingState</text><text class="p" x="20" y="104">one shared seam</text></g><g transform="translate(682 28)"><rect class="hot" width="178" height="82" rx="10"/><text class="k" x="18" y="27">WORLD PARTITION</text><text class="h" x="18" y="55">Streaming policy</text></g><g transform="translate(682 119)"><rect class="box" width="178" height="62" rx="10"/><text class="h" x="18" y="38">Level Instances</text></g><g transform="translate(682 190)"><rect class="box" width="178" height="82" rx="10"/><text class="h" x="18" y="35">Your subsystem</text><text class="p" x="18" y="58">same cadence</text></g></svg>
