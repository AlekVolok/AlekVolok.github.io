<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Render visibility and rasterization</title><desc id="d">The camera frustum selects scene proxies, occlusion removes hidden ones, and the remaining draw commands reach the GPU and become pixels.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5z" fill="#5eead4"/></marker><style>.bg{fill:#0b0d0f}.box{fill:#171b1f;stroke:#3a4249}.hot{fill:#14201f;stroke:#5eead4}.line{fill:none;stroke:#5eead4;stroke-width:1.7;marker-end:url(#a)}.frustum{fill:#5eead414;stroke:#5eead4}.k{fill:#5eead4;font:600 12px monospace}.h{fill:#eef2f3;font:600 16px system-ui}.p{fill:#8f9ba3;font:13px system-ui}</style></defs><rect class="bg" width="900" height="300" rx="16"/><path class="line" d="M350 150H432"/><path class="line" d="M612 150H684"/><g transform="translate(38 50)"><rect class="box" width="312" height="200" rx="12"/><text class="k" x="20" y="28">SCENE VISIBILITY</text><path class="frustum" d="M52 105 258 48v114z"/><path d="m38 96 20 9-20 9z" fill="#eef2f3"/><circle cx="200" cy="88" r="10" fill="#5eead4"/><circle cx="240" cy="135" r="10" fill="#5eead4"/><circle cx="176" cy="163" r="10" fill="#3a4249"/><rect x="214" y="98" width="18" height="55" fill="#69757d"/><text class="p" x="20" y="184">frustum + occlusion culling</text></g><g transform="translate(432 94)"><rect class="hot" width="180" height="112" rx="10"/><text class="k" x="20" y="29">DRAW COMMANDS</text><text class="h" x="20" y="61">Visible proxies</text><text class="p" x="20" y="86">sorted + submitted</text></g><g transform="translate(684 78)"><rect class="hot" width="178" height="144" rx="10"/><text class="k" x="20" y="29">GPU</text><rect x="20" y="49" width="64" height="64" rx="4" fill="#23433f"/><rect x="34" y="63" width="36" height="36" rx="18" fill="#5eead4"/><text class="h" x="100" y="75">Pixel</text><text class="p" x="100" y="98">finally</text></g></svg>
