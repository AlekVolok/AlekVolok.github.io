<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Scene proxy handoff from game thread to render thread</title><desc id="d">Registered primitive components enqueue render commands. The render thread consumes them and creates scene proxies.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5z" fill="#5eead4"/></marker><style>.bg{fill:#0b0d0f}.lane{fill:#101316;stroke:#2b3035}.box{fill:#171b1f;stroke:#3a4249}.hot{fill:#14201f;stroke:#5eead4}.line{fill:none;stroke:#5eead4;stroke-width:1.7;marker-end:url(#a)}.dash{stroke-dasharray:5 5}.k{fill:#5eead4;font:600 12px monospace}.h{fill:#eef2f3;font:600 16px system-ui}.p{fill:#8f9ba3;font:13px system-ui}</style></defs><rect class="bg" width="900" height="300" rx="16"/><rect class="lane" x="30" y="40" width="390" height="220" rx="12"/><rect class="lane" x="480" y="40" width="390" height="220" rx="12"/><text class="k" x="52" y="68">GAME THREAD</text><text class="k" x="502" y="68">RENDER THREAD</text><path class="line" d="M255 150H350"/><path class="line dash" d="M420 150H535"/><path class="line" d="M685 150H750"/><g transform="translate(52 104)"><rect class="box" width="203" height="92" rx="10"/><text class="h" x="20" y="38">Primitive component</text><text class="p" x="20" y="64">CreateRenderState</text></g><g transform="translate(350 104)"><rect class="hot" width="70" height="92" rx="10"/><text class="k" x="15" y="39">CMD</text><text class="p" x="15" y="63">queue</text></g><g transform="translate(535 104)"><rect class="hot" width="150" height="92" rx="10"/><text class="h" x="20" y="38">Scene proxy</text><text class="p" x="20" y="64">render state</text></g><g transform="translate(750 104)"><rect class="box" width="98" height="92" rx="10"/><text class="h" x="20" y="38">Scene</text><text class="p" x="20" y="64">ready</text></g></svg>
